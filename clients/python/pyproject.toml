[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pxclient"
version = "0.1.0"
description = "Admin CLI (pxadmin) for the shellbench OpenAI-compatible gateway"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]

[project.scripts]
pxadmin = "pxclient.admin:main"

[tool.setuptools]
packages = ["pxclient"]
